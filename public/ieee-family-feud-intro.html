<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0f">
  <title>IEEE Family Feud — Intro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --space-ink: #0a0a0f;
      --space-ink-soft: #111827;
      --ieee-blue: #00629B;
      --electric-blue: #54c8ff;
      --gold: #ffd45a;
      --warm-white: #fff9e8;
      --pale-blue: #d9edff;
      --title-size: clamp(3rem, 11vw, 11rem);
      --warp-duration: 2500ms;
      --title-duration: 1500ms;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-width: 320px;
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: var(--space-ink);
      color: #fff;
      font-family: "Anton", Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
    }

    .experience {
      position: relative;
      display: grid;
      width: 100%;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      place-items: center;
      background:
        radial-gradient(ellipse at 0% 0%, rgba(0, 98, 155, .12), transparent 38%),
        radial-gradient(ellipse at 100% 100%, rgba(0, 98, 155, .1), transparent 36%),
        var(--space-ink);
    }

    #starfield {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 38%, rgba(0, 0, 0, .48) 100%);
    }

    .flash {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at center, #fff 0%, #d8f5ff 18%, rgba(84, 200, 255, .8) 32%, transparent 72%);
    }

    .flash.fire {
      animation: flash-burst 850ms ease-out both;
    }

    .content {
      position: relative;
      z-index: 3;
      width: min(100% - 2rem, 1100px);
      padding: 2rem 0;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 clamp(1rem, 4vh, 2.4rem);
      color: #a7ddfa;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(.72rem, 1.5vw, 1rem);
      font-weight: 800;
      letter-spacing: .42em;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 700ms ease, transform 700ms ease;
    }

    .title-wrap {
      position: relative;
      display: inline-block;
      max-width: 100%;
      opacity: 0;
      transform: scale(.1);
      transform-origin: center;
      will-change: transform, opacity;
    }

    .title {
      position: relative;
      display: block;
      margin: 0;
      color: var(--gold);
      background: linear-gradient(180deg, #fff 0%, #fff5cf 27%, #ffd34d 62%, #ff9e24 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: var(--title-size);
      font-weight: 1000;
      line-height: .94;
      letter-spacing: .015em;
      text-transform: uppercase;
      -webkit-text-stroke: clamp(1px, .16vw, 2.5px) #0874b0;
      paint-order: stroke fill;
      filter:
        drop-shadow(0 0 .08em rgba(0, 98, 155, .95))
        drop-shadow(0 0 .24em rgba(0, 98, 155, .8))
        drop-shadow(0 .12em .1em rgba(0, 0, 0, .8));
    }

    .title span {
      display: block;
    }

    .title-shine {
      position: absolute;
      inset: -20% -25%;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      mask-image: linear-gradient(#000, #000);
      -webkit-mask-image: linear-gradient(#000, #000);
    }

    .title-shine::after {
      position: absolute;
      top: -20%;
      left: -55%;
      width: 34%;
      height: 145%;
      transform: skewX(-22deg);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .9), transparent);
      content: "";
    }

    .subtitle {
      min-height: 1.5em;
      margin: clamp(1.2rem, 3vh, 2rem) 0 0;
      color: #eaf7ff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(.9rem, 2.3vw, 1.35rem);
      font-weight: 700;
      letter-spacing: .16em;
      text-shadow: 0 0 1.2em rgba(84, 200, 255, .85);
      opacity: 0;
      transform: translateY(10px);
    }

    .experience.is-title .eyebrow {
      opacity: 1;
      transform: none;
    }

    .experience.is-title .title-wrap {
      animation: title-arrive var(--title-duration) cubic-bezier(.16, 1.35, .35, 1) both;
    }

    .experience.is-title .subtitle {
      animation: subtitle-arrive 850ms 450ms ease-out both;
    }

    .experience.is-title .title-shine {
      animation: shine-show 180ms 850ms ease-out both;
    }

    .experience.is-title .title-shine::after {
      animation: shine-sweep 1200ms 900ms ease-in-out both;
    }

    .controls {
      position: absolute;
      left: 50%;
      bottom: 2.25rem;
      z-index: 4;
      display: flex;
      gap: .8rem;
      transform: translateX(-50%);
    }

    .button {
      border: 1px solid rgba(118, 196, 240, .5);
      border-radius: 999px;
      padding: .9rem 1.6rem;
      color: #ebf7ff;
      background: rgba(5, 15, 27, .52);
      box-shadow: 0 0 18px rgba(84, 200, 255, .14), inset 0 0 15px rgba(28, 54, 72, .12);
      font-family: Arial, Helvetica, sans-serif;
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
    }

    .button:hover {
      transform: translateY(-1px);
      border-color: rgba(148, 220, 255, .82);
      box-shadow: 0 0 22px rgba(84, 200, 255, .2), inset 0 0 18px rgba(28, 54, 72, .2);
      background: rgba(9, 28, 42, .72);
    }

    .button.primary {
      background: linear-gradient(180deg, rgba(84, 200, 255, .18), rgba(0, 98, 155, .18));
    }

    .button[hidden] {
      display: none;
    }

    @keyframes title-arrive {
      0% { opacity: 0; transform: scale(.1); }
      72% { opacity: 1; transform: scale(1.09); }
      88% { transform: scale(.97); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes subtitle-arrive {
      to { opacity: 1; transform: none; }
    }

    @keyframes shine-show {
      to { opacity: 1; }
    }

    @keyframes shine-sweep {
      to { left: 125%; }
    }

    @keyframes flash-burst {
      0% { opacity: 0; transform: scale(.1); }
      32% { opacity: 1; }
      100% { opacity: 0; transform: scale(1.8); }
    }

    @media (max-width: 520px) {
      :root { --title-size: clamp(2.7rem, 14vw, 5.4rem); }
      .content { width: min(100% - 1.5rem, 1100px); }
      .eyebrow { letter-spacing: .28em; }
      .subtitle { max-width: 24rem; margin-right: auto; margin-left: auto; letter-spacing: .1em; }
      .controls { bottom: 1.4rem; }
      .button { letter-spacing: .14em; padding-inline: 1.2rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }

      .experience.is-title .title-wrap {
        animation: reduced-title-fade 650ms ease-out both !important;
      }

      @keyframes reduced-title-fade {
        from { opacity: 0; }
        to { opacity: 1; }
      }
    }
  </style>
</head>
<body>
  <main class="experience" id="experience" aria-label="IEEE Family Feud game show introduction">
    <canvas id="starfield" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div class="flash" id="flash" aria-hidden="true"></div>

    <section class="content" aria-live="polite">
      <p class="eyebrow" id="eyebrow"></p>
      <div class="title-wrap">
        <h1 class="title" id="title"></h1>
        <span class="title-shine" aria-hidden="true"></span>
      </div>
      <p class="subtitle" id="subtitle"></p>
    </section>

    <div class="controls" aria-label="Intro controls">
      <button id="startButton" class="button primary" type="button">Start</button>
      <button id="replayButton" class="button" type="button" hidden>Replay</button>
    </div>
  </main>

  <script>
    const CONFIG = {
      title: "IEEE FAMILY FEUD",
      subtitle: "IEEE SIES GST Student Branch",
      eyebrow: "IEEE DAY 2026",
      starCount: 420,
      autoStartMs: 5000,
      autoReplayMs: 20000,
      warpDurationMs: 2500,
      shootingStarEveryMs: [6000, 8000],
      glowColors: {
        spaceInk: "#0a0a0f",
        ieeeBlue: "#00629B",
        electricBlue: "#54c8ff",
        paleBlue: "#d9edff",
        white: "#ffffff",
        gold: "#ffd45a"
      }
    };

    const experience = document.getElementById("experience");
    const canvas = document.getElementById("starfield");
    const ctx = canvas.getContext("2d", { alpha: false });
    const flash = document.getElementById("flash");
    const titleNode = document.getElementById("title");
    const subtitleNode = document.getElementById("subtitle");
    const eyebrowNode = document.getElementById("eyebrow");
    const startButton = document.getElementById("startButton");
    const replayButton = document.getElementById("replayButton");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    const STAR_COUNT = Math.max(300, Math.min(500, CONFIG.starCount));
    const state = { mode: "idle", startedAt: 0, lastFrame: performance.now() };
    const stars = [];
    const sparkles = [];
    let shootingStar = null;
    let width = 0;
    let height = 0;
    let dpr = 1;
    let autoStartTimer = 0;
    let autoReplayTimer = 0;
    let flashTimer = 0;
    let shootingTimer = 0;
    let reducedMotionActive = reducedMotion.matches;

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function random(min, max) {
      return min + Math.random() * (max - min);
    }

    function makeStar() {
      return {
        x: random(-1, 1),
        y: random(-1, 1),
        depth: random(0.15, 1),
        radius: random(0.35, 1.25),
        phase: random(0, Math.PI * 2),
        twinkleSpeed: random(0.45, 1.6),
        drift: random(0.0007, 0.0025),
        opacity: random(0.2, 0.56),
        color: Math.random() < 0.68 ? CONFIG.glowColors.white : CONFIG.glowColors.paleBlue
      };
    }

    function setState(nextMode) {
      state.mode = nextMode;
      state.startedAt = performance.now();
      experience.classList.toggle("is-title", nextMode === "title");
      startButton.hidden = nextMode !== "idle";
      replayButton.hidden = nextMode !== "title";

      if (nextMode === "warp") {
        flash.classList.remove("fire");
        clearTimeout(flashTimer);
        flashTimer = window.setTimeout(() => {
          void flash.offsetWidth;
          flash.classList.add("fire");
          flashTimer = window.setTimeout(() => flash.classList.remove("fire"), 900);
        }, Math.max(0, CONFIG.warpDurationMs - 700));
      }

      if (nextMode === "title") {
        seedSparkles();
        clearTimeout(autoReplayTimer);
        autoReplayTimer = window.setTimeout(() => {
          if (state.mode === "title") replayIntro();
        }, CONFIG.autoReplayMs);
      }
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      if (!stars.length) {
        for (let i = 0; i < STAR_COUNT; i += 1) {
          stars.push(makeStar());
        }
      }
    }

    function drawNebula(x, y, radius, color, alpha) {
      const glow = ctx.createRadialGradient(x, y, 0, x, y, radius);
      glow.addColorStop(0, `${color}${Math.round(alpha * 255).toString(16).padStart(2, "0")}`);
      glow.addColorStop(1, `${color}00`);
      ctx.fillStyle = glow;
      ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
    }

    function drawBackground(time) {
      const gradient = ctx.createRadialGradient(
        width * 0.5,
        height * 0.47,
        0,
        width * 0.5,
        height * 0.5,
        Math.max(width, height) * 0.78
      );
      gradient.addColorStop(0, CONFIG.glowColors.spaceInk);
      gradient.addColorStop(0.58, "#08090f");
      gradient.addColorStop(1, "#05060a");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);

      drawNebula(width * 0.04 + Math.sin(time * 0.000025) * width * 0.015, height * 0.06, Math.max(width, height) * 0.3, CONFIG.glowColors.ieeeBlue, 0.075);
      drawNebula(width * 0.96 + Math.cos(time * 0.00002) * width * 0.012, height * 0.94, Math.max(width, height) * 0.27, CONFIG.glowColors.ieeeBlue, 0.065);
    }

    function drawNearbyConnections() {
      for (let i = 0; i < stars.length; i += 1) {
        const a = stars[i];
        const ax = width * 0.5 + a.x * width * 0.56;
        const ay = height * 0.5 + a.y * height * 0.56;
        for (let j = i + 1; j < stars.length; j += 1) {
          const b = stars[j];
          const bx = width * 0.5 + b.x * width * 0.56;
          const by = height * 0.5 + b.y * height * 0.56;
          const dx = ax - bx;
          const dy = ay - by;
          const distance = Math.hypot(dx, dy);
          if (distance < 64) {
            ctx.beginPath();
            ctx.moveTo(ax, ay);
            ctx.lineTo(bx, by);
            ctx.strokeStyle = `rgba(116, 194, 255, ${0.12 * (1 - distance / 64)})`;
            ctx.lineWidth = 0.7;
            ctx.stroke();
          }
        }
      }
    }

    function drawStars(time, delta) {
      const centerX = width / 2;
      const centerY = height / 2;
      const elapsed = time - state.startedAt;
      const warpProgress = state.mode === "warp" ? Math.min(1, elapsed / CONFIG.warpDurationMs) : 0;
      const easedWarp = warpProgress * warpProgress * warpProgress;
      const expansion = state.mode === "warp" ? 1 + easedWarp * 7.5 : 1;

      if (state.mode !== "warp") {
        drawNearbyConnections();
      }

      for (let i = 0; i < stars.length; i += 1) {
        const star = stars[i];

        if (state.mode !== "warp") {
          star.x += star.drift * delta * 0.42;
          if (star.x > 1.12) star.x = -1.12;
        }

        const parallaxX = Math.sin(time * 0.00008 + star.phase) * (1 - star.depth) * 8;
        const parallaxY = Math.cos(time * 0.00006 + star.phase) * (1 - star.depth) * 6;
        const x = centerX + star.x * width * 0.56 * expansion + parallaxX;
        const y = centerY + star.y * height * 0.56 * expansion + parallaxY;
        const size = star.radius * (0.5 + star.depth * 0.9);
        const twinkle = star.opacity * (0.68 + Math.sin(time * 0.001 * star.twinkleSpeed + star.phase) * 0.3);

        if (state.mode === "warp") {
          const previousExpansion = 1 + Math.max(0, easedWarp - 0.035) * 7.5;
          const previousX = centerX + star.x * width * 0.56 * previousExpansion;
          const previousY = centerY + star.y * height * 0.56 * previousExpansion;
          ctx.beginPath();
          ctx.moveTo(previousX, previousY);
          ctx.lineTo(x, y);
          ctx.strokeStyle = `rgba(174, 229, 255, ${Math.min(0.95, 0.18 + warpProgress * 0.85)})`;
          ctx.lineWidth = size * (1 + warpProgress * 2.5);
          ctx.stroke();
        } else if (x > -5 && x < width + 5 && y > -5 && y < height + 5) {
          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fillStyle = `${star.color}${Math.round(twinkle * 255).toString(16).padStart(2, "0")}`;
          ctx.fill();
        }
      }
    }

    function scheduleShootingStar() {
      clearTimeout(shootingTimer);
      shootingTimer = window.setTimeout(() => {
        if (state.mode !== "warp") {
          shootingStar = {
            x: random(width * 0.12, width * 0.9),
            y: random(height * 0.04, height * 0.5),
            progress: 0,
            duration: random(650, 1100),
            angle: random(0.32, 0.58)
          };
        }
        scheduleShootingStar();
      }, random(...CONFIG.shootingStarEveryMs));
    }

    function drawShootingStar(delta) {
      if (!shootingStar || state.mode === "warp") return;

      shootingStar.progress += delta / shootingStar.duration;
      if (shootingStar.progress >= 1) {
        shootingStar = null;
        return;
      }

      const length = Math.min(width, height) * 0.14;
      const x = shootingStar.x + shootingStar.progress * length * 1.6;
      const y = shootingStar.y + shootingStar.progress * length * shootingStar.angle;
      const fade = Math.sin(shootingStar.progress * Math.PI);
      const tail = ctx.createLinearGradient(x, y, x - length, y - length * shootingStar.angle);
      tail.addColorStop(0, `rgba(255,255,255,${fade * 0.55})`);
      tail.addColorStop(0.24, `rgba(84,200,255,${fade * 0.38})`);
      tail.addColorStop(1, "rgba(84,200,255,0)");

      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - length, y - length * shootingStar.angle);
      ctx.strokeStyle = tail;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    function seedSparkles() {
      sparkles.length = 0;
      for (let i = 0; i < 54; i += 1) {
        sparkles.push({
          angle: random(0, Math.PI * 2),
          distance: random(80, Math.min(width, height) * 0.42),
          size: random(1, 3),
          phase: random(0, Math.PI * 2),
          speed: random(0.35, 1.2)
        });
      }
    }

    function drawSparkles(time) {
      if (state.mode !== "title") return;

      const age = time - state.startedAt;
      if (age > 9000) return;

      const fade = Math.min(1, age / 700) * Math.max(0, 1 - Math.max(0, age - 6500) / 2500);
      const centerX = width / 2;
      const centerY = height / 2;

      for (const sparkle of sparkles) {
        const wave = Math.sin(time * 0.001 * sparkle.speed + sparkle.phase);
        const radius = sparkle.distance + wave * 8;
        const x = centerX + Math.cos(sparkle.angle) * radius;
        const y = centerY + Math.sin(sparkle.angle) * radius * 0.55;
        const alpha = (0.28 + (wave + 1) * 0.34) * fade;

        ctx.fillStyle = `rgba(255, 230, 151, ${alpha})`;
        ctx.fillRect(x, y, sparkle.size, sparkle.size);

        if (Math.random() > 0.5) {
          ctx.fillStyle = `rgba(148, 216, 255, ${alpha})`;
          ctx.fillRect(x - sparkle.size * 1.5, y + sparkle.size / 2, sparkle.size * 4, 1);
          ctx.fillRect(x + sparkle.size / 2, y - sparkle.size * 1.5, 1, sparkle.size * 4);
        }
      }
    }

    function render(time) {
      const delta = Math.min(50, time - state.lastFrame);
      state.lastFrame = time;

      drawBackground(time);
      drawStars(time, delta);
      drawShootingStar(delta);
      drawSparkles(time);

      if (state.mode === "warp" && time - state.startedAt >= CONFIG.warpDurationMs) {
        setState("title");
      }

      requestAnimationFrame(render);
    }

    function launchIntro() {
      if (state.mode !== "idle") return;
      clearTimeout(autoStartTimer);
      if (reducedMotionActive) {
        setState("title");
      } else {
        setState("warp");
      }
    }

    function replayIntro() {
      clearTimeout(autoReplayTimer);
      clearTimeout(flashTimer);
      flash.classList.remove("fire");
      shootingStar = null;
      setState("idle");
      launchIntro();
    }

    function onMotionPreferenceChange(event) {
      reducedMotionActive = event.matches;
    }

    titleNode.innerHTML = CONFIG.title.split(" ").map((word) => `<span>${escapeHtml(word)}</span>`).join(" ");
    eyebrowNode.textContent = CONFIG.eyebrow;
    subtitleNode.textContent = CONFIG.subtitle;

    startButton.addEventListener("click", launchIntro);
    replayButton.addEventListener("click", replayIntro);
    window.addEventListener("keydown", (event) => {
      if ((event.code === "Space" || event.key === "Enter") && !event.repeat) {
        event.preventDefault();
        if (state.mode === "idle") launchIntro();
        else if (state.mode === "title") replayIntro();
      }
    });

    window.addEventListener("resize", resize, { passive: true });
    if (reducedMotion.addEventListener) {
      reducedMotion.addEventListener("change", onMotionPreferenceChange);
    } else {
      reducedMotion.addListener(onMotionPreferenceChange);
    }

    resize();
    scheduleShootingStar();
    requestAnimationFrame(render);
    autoStartTimer = window.setTimeout(launchIntro, CONFIG.autoStartMs);
  </script>
</body>
</html>
