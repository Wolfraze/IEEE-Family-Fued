services:
  - type: web
    name: ieee-family-feud
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST_CODE
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: STATE_FILE
        value: /opt/render/project/src/state.json
